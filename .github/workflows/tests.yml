name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_engine.py tests/test_batch.py tests/test_studio.py
      - run: python tools/build_standalone.py --check
      - run: python -m compileall -q .
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Check actual GUI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/check_gui.py
      - name: Check actual GUI (Windows)
        if: runner.os == 'Windows'
        run: python tools/check_gui.py
